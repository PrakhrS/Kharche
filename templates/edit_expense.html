{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="auth-container">
    <header class="auth-header">
        <h1>Edit Expense</h1>
        <p>Update the details of your transaction</p>
    </header>

    <form action="{{ url_for('edit_expense', id=expense_id) }}" method="POST" class="auth-form">
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" name="amount" id="amount"
                   placeholder="0.00" step="0.01" min="0.01" required
                   value="{{ expense.amount if expense.amount is number else expense['amount'] }}">
            <div class="input-prefix">₹</div>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" required>
                <option value="" disabled>Select a category</option>
                {% for cat in categories %}
                <option value="{{ cat }}" {% if (expense.category if expense.category is number else expense['category']) == cat %}selected{% endif %}>
                    {{ cat }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" required
                   value="{{ expense.date if expense.date is number else expense['date'] }}">
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" name="description" id="description"
                   placeholder="What was this for?" maxlength="200"
                   value="{{ expense.description if expense.description is number else expense['description'] }}">
        </div>

        <div class="auth-actions">
            <a href="{{ url_for('profile') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-cta">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
