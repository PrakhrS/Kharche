{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<div class="auth-container">
    <header class="auth-header">
        <h1>Add Expense</h1>
        <p>Log a new transaction to your tracker</p>
    </header>

    <form action="{{ url_for('add_expense') }}" method="POST" class="auth-form">
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" name="amount" id="amount"
                   placeholder="0.00" step="0.01" min="0.01" required
                   value="{{ request.form.amount }}">
            <div class="input-prefix">₹</div>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" required>
                <option value="" disabled {% if not request.form.category %}selected{% endif %}>Select a category</option>
                {% for cat in ["Food", "Transport", "Bills", "Health", "Entertainment", "Shopping", "Other"] %}
                <option value="{{ cat }}" {% if request.form.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" required
                   value="{{ request.form.date or date_today }}">
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" name="description" id="description"
                   placeholder="What was this for?" maxlength="200"
                   value="{{ request.form.description }}">
        </div>

        <div class="auth-actions">
            <a href="{{ url_for('profile') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-cta">Save Expense</button>
        </div>
    </form>
</div>
{% endblock %}
